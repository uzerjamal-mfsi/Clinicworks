name: Deploy web to Azure Web App

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/main_app-clinicworks-dev.yml"
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.21.0"
  APP_NAME: "app-clinicworks-dev"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: |
          pnpm --filter @clinicworks/shared build
          pnpm --filter @clinicworks/db build

      - name: Build Next.js app
        run: pnpm --filter web build

      - name: Prepare standalone deployment package
        run: |
          set -e

          STANDALONE="apps/web/.next/standalone/apps/web"

          # 1. Copy static assets and public files to standalone location
          mkdir -p "$STANDALONE/.next"
          cp -R apps/web/.next/static "$STANDALONE/.next/static"

          if [ -d apps/web/public ]; then
            cp -R apps/web/public "$STANDALONE/public"
          fi

          # 2. Fallback check: Copy @swc/helpers if not traced
          if [ ! -d "apps/web/.next/standalone/node_modules/@swc/helpers" ]; then
            SWC_HELPERS_DIR=$(find node_modules/.pnpm -maxdepth 1 -type d -name '@swc+helpers@*' | head -n 1)
            if [ -n "$SWC_HELPERS_DIR" ]; then
              mkdir -p "apps/web/.next/standalone/node_modules/@swc"
              cp -R "$SWC_HELPERS_DIR/node_modules/@swc/helpers" "apps/web/.next/standalone/node_modules/@swc/helpers"
            fi
          fi

          # 3. Create zip from the standalone directory to repository root
          cd apps/web/.next/standalone
          zip -r -q "$GITHUB_WORKSPACE/deploy.zip" .

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-package
          path: deploy.zip
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-package

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: Production
          package: ./deploy.zip
