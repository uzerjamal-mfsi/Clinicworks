name: Deploy web to Azure Web App

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.21.0"
  APP_NAME: "app-clinicworks-dev"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: |
          pnpm --filter @clinicworks/shared --filter @clinicworks/db build

      - name: Build web
        run: pnpm --filter web build

      - name: Inspect Next standalone output
        working-directory: apps/web
        run: |
          echo "=== Standalone files ==="
          find .next/standalone -maxdepth 8 -type f | sort

      - name: Stage standalone output
        working-directory: apps/web
        run: |
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static

          if [ -d public ]; then
            cp -r public .next/standalone/public
          fi

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: apps/web/.next/standalone
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest

    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: web-app
          path: ./package

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: Production
          package: ./package
