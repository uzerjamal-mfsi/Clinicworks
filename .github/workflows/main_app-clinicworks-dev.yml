name: Deploy web to Azure Web App

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/main_app-clinicworks-dev.yml"
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.21.0"
  APP_NAME: "app-clinicworks-dev"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: |
          pnpm --filter @clinicworks/shared build
          pnpm --filter @clinicworks/db build

      - name: Build Next.js app
        run: pnpm --filter web build

      # Next.js standalone output in a pnpm monorepo is rooted at
      # apps/web/.next/standalone/apps/web.
      #
      # Copy the static assets and public directory into that runtime.
      - name: Prepare standalone deployment
        working-directory: apps/web
        run: |
          set -e

          STANDALONE=".next/standalone/apps/web"

          mkdir -p "$STANDALONE/.next"

          cp -R .next/static "$STANDALONE/.next/static"

          if [ -d public ]; then
            cp -R public "$STANDALONE/public"
          fi

          # Make @swc/helpers available to the standalone runtime.
          pnpm exec --package=@swc/helpers true

          SWC_HELPERS_DIR=$(find ../../node_modules/.pnpm \
            -maxdepth 1 \
            -type d \
            -name '@swc+helpers@*' \
            | head -n 1)

          if [ -n "$SWC_HELPERS_DIR" ]; then
            mkdir -p ".next/standalone/node_modules/@swc"
            rm -rf ".next/standalone/node_modules/@swc/helpers"
            cp -R "$SWC_HELPERS_DIR/node_modules/@swc/helpers" \
              ".next/standalone/node_modules/@swc/helpers"
          fi

          echo "=== Deployment structure ==="
          find .next/standalone/apps/web -maxdepth 3 -type f | sort | head -200

          echo "=== @swc/helpers ==="
          ls -la .next/standalone/node_modules/@swc/helpers || true

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: apps/web/.next/standalone
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest

    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: web-app
          path: ./package

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure Azure Web App
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp config appsettings set \
              --resource-group rg-clinicworks-dev \
              --name ${{ env.APP_NAME }} \
              --settings \
                SCM_DO_BUILD_DURING_DEPLOYMENT=false \
                WEBSITE_RUN_FROM_PACKAGE=1

            az webapp config set \
              --resource-group rg-clinicworks-dev \
              --name ${{ env.APP_NAME }} \
              --startup-file "node apps/web/server.js"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: Production
          package: ./package
