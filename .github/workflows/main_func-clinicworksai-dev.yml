name: Build and Deploy Function App to Azure

on:
  push:
    branches:
      - main
    paths:
      - "apps/function/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/main_func-clinicworksai-dev.yml"
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.21.0"
  FUNCTION_APP_NAME: "func-clinicworksai-dev"
  IMAGE_NAME: "function"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages & function
        run: |
          pnpm --filter @clinicworks/shared build
          pnpm --filter @clinicworks/db build
          pnpm --filter function build

      - name: Create self-contained deployment package using pnpm deploy
        run: |
          set -e
          # 1. Use --legacy flag for pnpm v10+ workspace deployment
          pnpm --filter=function --legacy --prod deploy ./deploy-func

          # 2. Copy compiled dist into deploy-func
          cp -R apps/function/dist ./deploy-func/

          # 3. Create zip from inside deploy-func so host.json is at root
          cd ./deploy-func
          zip -r -q "$GITHUB_WORKSPACE/function.zip" .

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: ./function.zip
